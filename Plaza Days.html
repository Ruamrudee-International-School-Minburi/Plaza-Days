<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plaza Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#1b1426;
  --paper:#eef0ea; --paper2:#e0e4dc; --ink:#3b3552; --ink2:#787290;
  --neon:#ff5fa2; --teal:#23a091; --sun:#ffc94d; --ok:#2b9a5f; --bad:#cf4337;
  --board:#20264a; --board2:#2c345f; --line:#5be0cf; --boardtext:#f3f4ff;
  --chip:rgba(27,20,40,.86); --chiptext:#fff6f9;
  --scrim:rgba(14,8,26,.62); --cork:#c99a62;
  --fs:16px;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110c19; --paper:#d8dbd2; --paper2:#c8ccc2; --ink:#29243f; --ink2:#5d5873;
    --board:#171b37; --board2:#20274d; --chip:rgba(14,10,22,.9); --scrim:rgba(6,3,12,.72); --cork:#a97f4e;
  }
}
:root[data-theme="dark"]{
  --bg:#110c19; --paper:#d8dbd2; --paper2:#c8ccc2; --ink:#29243f; --ink2:#5d5873;
  --board:#171b37; --board2:#20274d; --chip:rgba(14,10,22,.9); --scrim:rgba(6,3,12,.72); --cork:#a97f4e;
}
:root[data-text="large"]{--fs:18.5px}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Pixelify Sans',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:var(--fs);line-height:1.3;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#0d0914}
#view{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img.ico,.ico{image-rendering:crisp-edges;image-rendering:pixelated}
.px{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;background:var(--teal);color:#fff;font-weight:700;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.18);text-align:center;line-height:1.15}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.42;cursor:default;transform:none}
.btn.pink{background:var(--neon)} .btn.sun{background:var(--sun);color:#3a2a10} .btn.dark{background:#3b3552;color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink2)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:.88em} .btn.full{width:100%}
.btn img{width:20px;height:20px}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;padding:8px calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));display:flex;align-items:flex-start;justify-content:space-between;gap:6px;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
.hcol{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.hrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--chiptext);padding:5px 9px;font-weight:600;line-height:1.15;font-size:.95em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip img{width:20px;height:20px}
#hudCash{color:#a6f5bf;font-family:'Silkscreen',monospace;font-size:.9em}
.ebar{width:58px;height:9px;background:#3a3150;position:relative;overflow:hidden}
.ebar i{position:absolute;left:0;top:0;bottom:0;background:#ffc94d;transition:width .4s}
.ebar.low i{background:#ff5f6d}
#hudBasket{background:rgba(255,95,162,.92);pointer-events:auto;cursor:pointer}
.hbtns{display:flex;gap:5px}
.hbtn{pointer-events:auto;width:42px;height:42px;background:var(--chip);display:grid;place-items:center;color:#fff;font-weight:700}
.hbtn img{width:26px;height:26px}
.hbtn .dot{position:absolute;margin:-18px 0 0 18px;width:9px;height:9px;background:var(--neon)}

#toasts{position:absolute;left:50%;top:96px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:8;width:min(92%,420px)}
.toast{background:var(--paper);color:var(--ink);padding:7px 12px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.28);animation:tin .22s ease-out;transition:opacity .3s,transform .3s;max-width:100%}
.toast img{width:24px;height:24px;flex:none}
.toast.money{background:#d9f7e3;color:#184a2c}
.toast.warn{background:#ffe1d9;color:#6a1f16}
.toast.special{background:var(--sun);color:#3a2a10}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#pa{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:9;background:#14111f;color:#ffcf5a;font-family:'Silkscreen',monospace;font-size:.82em;line-height:1.4;padding:8px 14px;width:max-content;max-width:min(94%,560px);text-align:center;
  box-shadow:inset 0 0 0 2px #3a2f58,0 0 18px rgba(255,207,90,.25);text-shadow:0 0 6px rgba(255,207,90,.55);pointer-events:none}
#pa[hidden]{display:none}

/* touch */
#touch{position:absolute;inset:0;pointer-events:none;z-index:6}
#touch[hidden]{display:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:64%;pointer-events:auto}
#stickBase{position:absolute;left:calc(84px + var(--safe-l));top:calc(100% - 116px);width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 3px rgba(255,255,255,.26);pointer-events:none;opacity:.6}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;text-align:center;line-height:1.05;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.2)}
.tbtn:active{transform:translateY(2px)}
#actBtn{right:calc(18px + var(--safe-r));bottom:30px;width:86px;height:86px;background:var(--neon);font-size:.92em;padding:6px}
#actBtn.dim{background:rgba(255,95,162,.42)}
#bagBtn{right:calc(116px + var(--safe-r));bottom:22px;width:58px;height:58px;background:rgba(35,160,145,.9)}
#bagBtn img{width:28px;height:28px}

/* panels */
#panel{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--scrim);padding:22px calc(12px + var(--safe-r)) 22px calc(12px + var(--safe-l))}
#panel[hidden]{display:none}
.sheet{width:min(100%,440px);max-height:100%;display:flex;flex-direction:column;position:relative;animation:pop .16s ease-out}
.sheet.wide{width:min(100%,560px)}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.receipt{background:var(--paper);color:var(--ink);padding:16px 16px 14px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.28))}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:8px}
.receipt::before{top:-8px;background:conic-gradient(from 135deg at top,var(--paper) 90deg,transparent 0) 50%/16px 100%}
.receipt::after{bottom:-8px;background:conic-gradient(from -45deg at bottom,var(--paper) 90deg,transparent 0) 50%/16px 100%}
.cork{background:var(--cork);color:var(--ink);padding:16px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.28)}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-head img.ico{width:36px;height:36px}
.sh-title{font-size:1.28em;font-weight:700;line-height:1.1}
.sh-sub{color:var(--ink2);font-size:.86em;margin-top:2px}
.sh-tt{flex:1;min-width:0}
.x{width:40px;height:40px;display:grid;place-items:center;font-size:1.3em;color:var(--ink2);flex:none}
.rule{border:0;border-top:2px dashed var(--ink2);opacity:.55;margin:8px 0}
.sh-body{overflow:auto;min-height:0;flex:1 1 auto;margin:0 -8px;padding:0 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sh-foot .grow{flex:1}
.note{font-size:.86em;color:var(--ink2);margin:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:2px dotted rgba(59,53,82,.22)}
.row:last-child{border-bottom:0}
.row .ico{width:32px;height:32px;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600}
.row .nm small{display:block;color:var(--ink2);font-size:.8em;line-height:1.25}
.row .acts{display:flex;gap:6px;flex:none}
.price{font-family:'Silkscreen',monospace;font-size:.86em;white-space:nowrap}
.tag{display:inline-block;font-family:'Silkscreen',monospace;font-size:.68em;padding:1px 5px;background:var(--neon);color:#fff;vertical-align:middle;margin-left:4px}
.tag.teal{background:var(--teal)} .tag.sun{background:var(--sun);color:#3a2a10} .tag.ink{background:var(--ink);color:var(--paper)}
.strike{text-decoration:line-through;color:var(--ink2);font-size:.82em;margin-right:4px}
.ln{display:flex;align-items:baseline;gap:6px;font-family:'Silkscreen',monospace;font-size:.82em;padding:2px 0}
.ln .ld{flex:1;border-bottom:2px dotted var(--ink2);opacity:.45;transform:translateY(-3px);min-width:12px}
.ln.big{font-size:1em;font-weight:700}
.ln .t{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhead{text-align:center;font-family:'Silkscreen',monospace;line-height:1.4;font-size:.86em}
.rhead b{font-size:1.25em;display:block}
.barcode{height:32px;margin:12px auto 2px;width:70%;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 4px,transparent 4px 7px,var(--ink) 7px 10px,transparent 10px 11px,var(--ink) 11px 12px,transparent 12px 15px,var(--ink) 15px 16px,transparent 16px 19px)}
.mline{display:flex;width:100%;align-items:baseline;gap:8px;padding:9px 4px;font-size:1.04em;font-weight:600;text-align:left;color:var(--ink)}
.mline .ld{flex:1;border-bottom:2px dotted var(--ink2);opacity:.42;transform:translateY(-4px)}
.mline .k{font-family:'Silkscreen',monospace;font-size:.72em;color:var(--ink2)}
.mline:hover,.mline:focus-visible{background:rgba(35,160,145,.13)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{padding:6px 12px;font-weight:600;background:var(--paper2);min-height:36px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.cell{background:var(--paper2);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74em;text-align:center;line-height:1.1;min-height:74px;position:relative;color:var(--ink)}
.cell .ico{width:32px;height:32px}
.cell .q{position:absolute;right:4px;top:3px;font-family:'Silkscreen',monospace;font-size:.95em}
.cell.sel{box-shadow:inset 0 0 0 3px var(--teal)}
.cell.worn::after{content:"ON";position:absolute;left:4px;top:3px;font-family:'Silkscreen',monospace;font-size:.85em;color:var(--neon)}
.cell.unseen .ico{filter:brightness(0);opacity:.22}
.cell.seen .ico{filter:grayscale(1);opacity:.55}
.cat{font-family:'Silkscreen',monospace;font-size:.72em;color:var(--ink2);margin:10px 0 4px}
.detail{background:var(--paper2);padding:10px;margin:6px 0 10px;display:flex;gap:10px;align-items:center}
.detail .ico{width:48px;height:48px}
.detail .nm{flex:1;min-width:0}
.bar{height:10px;background:var(--paper2);position:relative;overflow:hidden;margin:6px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:34px;height:34px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 6px #fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 11px;background:var(--paper2);font-weight:600;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{margin:10px 0}
.flabel{display:block;font-size:.84em;color:var(--ink2);margin-bottom:5px;font-weight:600}
input[type=text],textarea{font:inherit;width:100%;padding:8px 10px;background:#fbfbf8;color:#2a2540;border:2px solid var(--ink2);border-radius:0;-webkit-user-select:text;user-select:text}
textarea{min-height:90px;font-family:'Silkscreen',monospace;font-size:.72em;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.rng{display:flex;align-items:center;gap:10px}
.rng span{width:42px;text-align:right;font-family:'Silkscreen',monospace;font-size:.8em}
.hag{position:relative;height:30px;background:#cfd3ca;margin:16px 0 10px;box-shadow:inset 0 0 0 2px var(--ink2)}
.hag .zone{position:absolute;top:0;bottom:0;background:rgba(43,154,95,.6)}
.hag .gold{position:absolute;top:0;bottom:0;background:#ffc94d}
.hag .mk{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;background:var(--ink)}
.slot{display:flex;gap:10px;align-items:center;padding:9px;background:var(--paper2);margin-bottom:8px}
.slot .thumb{width:96px;height:54px;image-rendering:pixelated;background:#2a2238;flex:none;display:grid;place-items:center;color:#8d86a8;font-family:'Silkscreen',monospace;font-size:.7em}
.slot .meta{flex:1;min-width:0;font-size:.86em;line-height:1.3}
.slot .meta b{font-size:1.06em}
.slot .sa{display:flex;flex-direction:column;gap:5px}
.mini{width:100%;image-rendering:pixelated;background:#1d1730;display:block;margin:4px 0 8px}
.notecard{background:#fffdf3;padding:10px 12px;margin:0 0 10px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.notecard:nth-child(odd){transform:rotate(-.8deg)} .notecard:nth-child(even){transform:rotate(.7deg)}
.notecard h4{margin:0 0 4px;font-size:1.05em}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0}
.chk i{width:16px;height:16px;box-shadow:inset 0 0 0 2px var(--ink);flex:none;position:relative}
.chk.on i::after{content:"";position:absolute;inset:3px;background:var(--ok)}
.chk.on span{text-decoration:line-through;color:var(--ink2)}
.claw{height:120px;background:#bfe9f2;position:relative;overflow:hidden;box-shadow:inset 0 0 0 4px var(--neon);margin:8px 0}
.claw .arm{position:absolute;left:50%;top:0;width:4px;height:20px;background:#555;transition:height .9s ease-in-out,left .9s ease-in-out}
.claw .arm::after{content:"";position:absolute;left:-8px;bottom:-8px;width:20px;height:10px;border:3px solid #555;border-top:0}
.claw .pile{position:absolute;left:8px;right:8px;bottom:6px;display:flex;justify-content:space-around}
.claw .pile img{width:32px;height:32px}

/* dialogue */
#talk{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(calc(100% - 24px),560px);z-index:25}
#talk[hidden]{display:none}
#talk .bubble{background:#fffdf7;color:#2c2742;padding:12px 16px 12px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
#talk .who{display:inline-block;padding:3px 10px;margin:0 0 6px;color:#fff;font-weight:700;font-size:.9em}
#talk p{margin:0 0 10px;line-height:1.35}
#talk .opts{display:flex;flex-wrap:wrap;gap:8px}

/* title */
#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px calc(16px + var(--safe-r)) 22px calc(16px + var(--safe-l));pointer-events:none}
#title[hidden]{display:none}
#title > *{pointer-events:auto}
.tap{font-family:'Silkscreen',monospace;color:#fff;font-size:1em;text-shadow:0 2px 0 #000;animation:blink 1.4s steps(2,start) infinite;margin-bottom:9vh;background:none;padding:12px}
@keyframes blink{50%{opacity:.25}}
.board{background:var(--board);color:var(--boardtext);box-shadow:inset 0 0 0 3px var(--board2),inset 0 0 0 5px var(--line)}
.dir{width:min(100%,360px);padding:12px 12px 10px}
.dir .dh{font-family:'Silkscreen',monospace;font-size:.72em;color:var(--line);display:flex;justify-content:space-between;padding:2px 8px 6px}
.dir .opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;font-size:1.06em;font-weight:600;color:var(--boardtext);text-align:left}
.dir .opt small{font-size:.74em;color:#a9b0d9;font-weight:400;text-align:right}
.dir .opt:hover,.dir .opt:focus-visible{background:rgba(91,224,207,.15)}
.dir .opt[disabled]{opacity:.4}
.cloud{font-family:'Silkscreen',monospace;font-size:.7em;color:#a9b0d9;text-align:center;padding-top:6px}

#saveicon{position:absolute;left:calc(12px + var(--safe-l));top:calc(100% - 44px);z-index:7;font-family:'Silkscreen',monospace;font-size:.72em;color:#fff;background:var(--chip);padding:6px 10px;pointer-events:none;transition:opacity .4s}
#saveicon[hidden]{display:none}
#fade{position:absolute;inset:0;background:#0d0914;opacity:0;pointer-events:none;transition:opacity .32s;z-index:30}
#fade.on{opacity:1;pointer-events:auto}
#fade.slow{transition-duration:.9s}
#fade .msg{position:absolute;left:0;right:0;top:46%;text-align:center;color:#ffe9b0;font-family:'Silkscreen',monospace;font-size:1em;padding:0 20px}
@media (min-aspect-ratio:5/4){ #title{align-items:flex-end;justify-content:center;padding-right:calc(5vw + var(--safe-r))} }
#title.boot{align-items:center;justify-content:flex-end}
@media (max-width:560px){ #toasts{top:132px} #pa{top:118px} }
@media (max-width:420px){ .chip{font-size:.86em;padding:5px 7px} .hbtn{width:38px;height:38px} .ebar{width:46px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="game">
  <canvas id="view" aria-label="Plaza Days game view"></canvas>
  <div id="hud" hidden>
    <div class="hcol">
      <div class="hrow">
        <div class="chip px" id="hudCash">$0.00</div>
        <div class="chip px" id="hudEnergy" title="Energy"><span id="hudEIco"></span><span class="ebar"><i></i></span></div>
      </div>
      <div class="chip px" id="hudClock">Thu 08:00</div>
      <button class="chip px" id="hudBasket" hidden></button>
    </div>
    <div class="hbtns">
      <button class="hbtn px" id="hbList" aria-label="Shopping list (L)"></button>
      <button class="hbtn px" id="hbBag" aria-label="Bag (Tab)"></button>
      <button class="hbtn px" id="hbMap" aria-label="Map (M)"></button>
      <button class="hbtn px" id="hbPause" aria-label="Pause menu (Esc)">II</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="pa" hidden></div>
  <div id="touch" hidden>
    <div id="stickZone"></div>
    <div id="stickBase"><div id="stickKnob"></div></div>
    <button id="bagBtn" class="tbtn" aria-label="Bag"></button>
    <button id="actBtn" class="tbtn dim" aria-label="Interact"><span class="lbl">Use</span></button>
  </div>
  <div id="talk" hidden></div>
  <div id="title" hidden></div>
  <div id="panel" hidden></div>
  <div id="saveicon" hidden>Saved</div>
  <div id="fade"><div class="msg"></div></div>
</div>
<script>
(function(){
'use strict';
// ================= core =================
const TILE = 16;
const DIRV = [[0,1],[-1,0],[1,0],[0,-1]]; // down, left, right, up
const WEEK = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WEEK_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const $ = (s, r)=> (r||document).querySelector(s);

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function money(c){
  c = Math.round(c); const neg = c < 0; c = Math.abs(c);
  return (neg?'-':'') + '$' + Math.floor(c/100).toLocaleString('en-US') + '.' + String(c%100).padStart(2,'0');
}
function fmtTime(m){ m = ((Math.floor(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function hashStr(s){ let x = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function srand(...p){ return mulberry32(hashStr(p.join('|'))); }
function rnd(...p){ return srand(...p)(); }
function pick(a, r){ r = r || Math.random; return a[Math.floor(r()*a.length)]; }
function shuffle(a, r){ r = r || Math.random; a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  if (amt < 0){ const k = 1+amt; r*=k; g*=k; b*=k; } else { r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  return '#' + [r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
}
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1,w|0); c.height = Math.max(1,h|0); return c; }
function ago(ts){
  const s = Math.max(0, (Date.now()-ts)/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+' min ago';
  if (s < 86400) return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}
function playTimeStr(sec){ const m = Math.floor(sec/60); return m < 60 ? m+'m' : Math.floor(m/60)+'h '+(m%60)+'m'; }

const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },

const Settings = {
  d: { master:.9, music:.6, sfx:.8, amb:.6, zoom:'normal', speed:'normal', touch:'auto', fx:true, text:'normal' },
  load(){ try { const s = JSON.parse(LS.get('plazadays.settings') || 'null'); if (s && typeof s === 'object') Object.assign(this.d, s); } catch(e){} this.apply(); },
  save(){ LS.set('plazadays.settings', JSON.stringify(this.d)); },
  apply(){
    document.documentElement.setAttribute('data-text', this.d.text);
    if (typeof Snd !== 'undefined') Snd.vol();
    if (typeof Main !== 'undefined' && Main.ready) Main.resize();
    if (typeof Input !== 'undefined') Input.refreshTouch();
  },
  secsPerMin(){ return this.d.speed === 'relaxed' ? 1.0 : this.d.speed === 'quick' ? 0.45 : 0.7; },
};

// ---------------- input ----------------
const Input = {
  down: new Set(), q: [], joy: {x:0,y:0,on:false,id:null,ox:0,oy:0}, touchSeen: false,
  KEYMAP: {ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'},
  ACTMAP: {KeyE:'act',Space:'act',Enter:'act',NumpadEnter:'act',Tab:'bag',KeyI:'bag',KeyL:'list',KeyM:'map',Escape:'pause',KeyP:'pause',KeyC:'book'},
  init(){
    addEventListener('keydown', e=>this.key(e, true));
    addEventListener('keyup', e=>this.key(e, false));
    addEventListener('blur', ()=>{ this.down.clear(); this.joyEnd(); });
    const zone = $('#stickZone');
    zone.addEventListener('pointerdown', e=>{
      Snd.unlock(); this.touchSeen = true; this.refreshTouch();
      try { zone.setPointerCapture(e.pointerId); } catch(err){}
      const r = $('#game').getBoundingClientRect(), base = $('#stickBase');
      this.joy.id = e.pointerId; this.joy.on = true; this.joy.ox = e.clientX; this.joy.oy = e.clientY;
      base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px'; base.classList.add('on');
      this.joyMove(e); e.preventDefault();
    });
    zone.addEventListener('pointermove', e=>{ if (e.pointerId === this.joy.id) this.joyMove(e); });
    const end = e=>{ if (e.pointerId === this.joy.id) this.joyEnd(); };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
    const tap = (id, act)=> $(id).addEventListener('pointerdown', e=>{ e.preventDefault(); Snd.unlock(); this.touchSeen = true; if (Game.mode === 'play' && !UI.isOpen()) this.q.push(act); });
    tap('#actBtn', 'act'); tap('#bagBtn', 'bag');
    addEventListener('touchstart', ()=>{ if (!this.touchSeen){ this.touchSeen = true; this.refreshTouch(); } }, {passive:true});
    document.addEventListener('gesturestart', e=>e.preventDefault());
    document.addEventListener('dblclick', e=>e.preventDefault());
    document.addEventListener('touchmove', e=>{
      const t = e.target;
      if (t && t.closest && t.closest('.sh-body, textarea, input')) return;
      e.preventDefault();
    }, {passive:false});
  },
  joyMove(e){
    let dx = e.clientX - this.joy.ox, dy = e.clientY - this.joy.oy; const R = 44, d = Math.hypot(dx,dy);
    if (d > R){ dx *= R/d; dy *= R/d; }
    $('#stickKnob').style.transform = 'translate('+dx+'px,'+dy+'px)';
    if (d > 7){ this.joy.x = dx/R; this.joy.y = dy/R; } else { this.joy.x = 0; this.joy.y = 0; }
  },
  joyEnd(){
    this.joy.on = false; this.joy.id = null; this.joy.x = 0; this.joy.y = 0;
    const k = $('#stickKnob'), b = $('#stickBase'); if (k) k.style.transform = '';
    if (b){ b.classList.remove('on'); b.style.left = ''; b.style.top = ''; }
  },
  refreshTouch(){
    const el = $('#touch'); if (!el) return;
    const mode = Settings.d.touch;
    const show = Game.mode === 'play' && (mode === 'on' || (mode === 'auto' && this.touchSeen));
    el.hidden = !show;
  },
  key(e, isDown){
    const tag = e.target && e.target.tagName || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if (isDown){
      Snd.unlock();
      if (this.touchSeen && Settings.d.touch === 'auto' && !typing && (this.KEYMAP[e.code] || this.ACTMAP[e.code])){ this.touchSeen = false; this.refreshTouch(); }
      if (Game.mode === 'boot'){ Main.enter(); e.preventDefault(); return; }
    }
    const dir = this.KEYMAP[e.code];
    if (dir){
      if (typing) return;
      if (isDown) this.down.add(dir); else this.down.delete(dir);
      if (Game.mode === 'play' && !UI.isOpen()) e.preventDefault();
      return;
    }
    if (!isDown || e.repeat) return;
    const act = this.ACTMAP[e.code];
    if (!act) return;
    if (typing && act !== 'pause') return;
    if (UI.handleKey(act, e)){ e.preventDefault(); return; }
    if (Game.mode === 'play' && !UI.isOpen()){ e.preventDefault(); this.q.push(act); }
  },
  vec(){
    let x = 0, y = 0;
    if (this.down.has('left')) x -= 1; if (this.down.has('right')) x += 1;
    if (this.down.has('up')) y -= 1; if (this.down.has('down')) y += 1;
    if (this.joy.on && (this.joy.x || this.joy.y)){ x = this.joy.x; y = this.joy.y; }
    const m = Math.hypot(x,y); if (m > 1){ x /= m; y /= m; }
    return {x, y};
  },
};
// ================= audio =================
const Snd = {
  ctx:null, ok:false, master:null, comp:null, music:null, mfade:null, mfilt:null, sfx:null, amb:null, noise:null, pulse:null,
  filterMode:'open',
  unlock(){
    if (!this.ctx) this.init();
    else if (this.ctx.state === 'suspended' && !document.hidden) { try { this.ctx.resume(); } catch(e){} }
  },
  init(){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    let c; try { c = new AC(); } catch(e){ return; }
    this.ctx = c;
    this.master = c.createGain();
    this.comp = c.createDynamicsCompressor();
    try { this.comp.threshold.value = -12; this.comp.knee.value = 12; this.comp.ratio.value = 3.5; this.comp.attack.value = .004; this.comp.release.value = .2; } catch(e){}
    this.comp.connect(this.master); this.master.connect(c.destination);
    this.mfade = c.createGain(); this.mfade.gain.value = 0;
    this.mfilt = c.createBiquadFilter(); this.mfilt.type = 'lowpass'; this.mfilt.frequency.value = 16000; this.mfilt.Q.value = .5;
    this.music = c.createGain();
    this.mfade.connect(this.mfilt); this.mfilt.connect(this.music); this.music.connect(this.comp);
    this.sfx = c.createGain(); this.sfx.connect(this.comp);
    this.amb = c.createGain(); this.amb.connect(this.comp);
    const len = c.sampleRate*2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
    const N = 24, re = new Float32Array(N), im = new Float32Array(N);
    for (let n=1;n<N;n++) re[n] = 2/(n*Math.PI)*Math.sin(n*Math.PI*.25);
    try { this.pulse = c.createPeriodicWave(re, im); } catch(e){ this.pulse = null; }
    this.ok = true;
    this.vol();
    Amb.init();
    Music.boot();
    if (c.state === 'suspended'){ try { c.resume(); } catch(e){} }
    document.addEventListener('visibilitychange', ()=>{
      if (!this.ctx) return;
      try { if (document.hidden) this.ctx.suspend(); else this.ctx.resume(); } catch(e){}
    });
  },
  vol(){
    if (!this.ok) return;
    const s = Settings.d, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(s.master, t, .05);
    this.music.gain.setTargetAtTime(s.music*.5, t, .05);
    this.sfx.gain.setTargetAtTime(s.sfx*.85, t, .05);
    this.amb.gain.setTargetAtTime(s.amb*.8, t, .05);
  },
  running(){ return this.ok && this.ctx.state === 'running'; },
  play(name, dest){
    if (!this.running()) return; const f = SFX[name]; if (!f) return;
    try { f(this.ctx.currentTime + .01, dest || this.sfx); } catch(e){}
  },
  playAt(name, x, y){
    if (!this.running()) return;
    const p = World.player; if (!p){ this.play(name); return; }
    const dx = x - p.x, dy = y - p.y, dist = Math.hypot(dx,dy), v = clamp(1 - dist/240, 0, 1);
    if (v <= .03) return;
    const c = this.ctx, g = c.createGain(); g.gain.value = v;
    if (c.createStereoPanner){ const pn = c.createStereoPanner(); pn.pan.value = clamp(dx/170, -.9, .9); g.connect(pn); pn.connect(this.sfx); }
    else g.connect(this.sfx);
    this.play(name, g);
    setTimeout(()=>{ try { g.disconnect(); } catch(e){} }, 4000);
  },
  setFilter(mode){
    if (this.filterMode === mode) return; this.filterMode = mode;
    if (!this.ok) return;
    const f = mode === 'pause' ? 650 : mode === 'store' ? 1300 : 16000;
    this.mfilt.frequency.setTargetAtTime(f, this.ctx.currentTime, .22);
  },
};

function osc(type, f, t0, dur, v, dest, o){
  o = o || {};
  const c = Snd.ctx, os = c.createOscillator(), g = c.createGain();
  if (type === 'pulse' && Snd.pulse) os.setPeriodicWave(Snd.pulse); else os.type = type === 'pulse' ? 'square' : type;
  os.frequency.setValueAtTime(f, t0);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + (o.slide || dur));
  if (o.vib){
    const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = f*.012;
    l.connect(lg); lg.connect(os.frequency); l.start(t0+.08); l.stop(t0+dur+.2);
  }
  const a = o.a == null ? .005 : o.a, r = o.r == null ? dur : o.r;
  g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(Math.max(.0002, v), t0 + a);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + a + r);
  os.connect(g); g.connect(dest || Snd.sfx); os.start(t0); os.stop(t0 + a + r + .05);
}
function nz(t0, dur, v, ftype, f, q, dest, o){
  o = o || {};
  const c = Snd.ctx, s = c.createBufferSource(); s.buffer = Snd.noise; s.loop = true;
  const fl = c.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f, t0);
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  fl.Q.value = q || 1;
  const g = c.createGain(), a = o.a == null ? .003 : o.a;
  g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(Math.max(.0002, v), t0 + a);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + Math.max(dur, a + .01));
  s.connect(fl); fl.connect(g); g.connect(dest || Snd.sfx);
  s.start(t0, Math.random()*1.5); s.stop(t0 + dur + .06);
}

// --------- ambience loops ---------
const Amb = {
  ch:{},
  init(){
    const c = Snd.ctx;
    const mk = (type, f, q)=>{
      const s = c.createBufferSource(); s.buffer = Snd.noise; s.loop = true;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = c.createGain(); g.gain.value = 0;
      let out = g;
      fl.connect(g); s.connect(fl);
      let pn = null;
      if (c.createStereoPanner){ pn = c.createStereoPanner(); g.connect(pn); pn.connect(Snd.amb); } else g.connect(Snd.amb);
      s.start(0, Math.random()*1.5);
      return {s, fl, g, pn, out};
    };
    this.ch.rain = mk('bandpass', 1500, .35);
    this.ch.crowd = mk('bandpass', 430, 1.2);
    this.ch.fountain = mk('bandpass', 2600, .6);
    this.ch.sizzle = mk('highpass', 3600, .5);
    this.ch.traffic = mk('lowpass', 240, .7);
  },
  set(name, vol, pan){
    if (!Snd.ok) return; const ch = this.ch[name]; if (!ch) return;
    const t = Snd.ctx.currentTime;
    ch.g.gain.setTargetAtTime(Math.max(0, vol), t, .3);
    if (ch.pn && pan != null) ch.pn.pan.setTargetAtTime(clamp(pan,-.9,.9), t, .1);
  },
  silence(){ for (const k in this.ch) this.set(k, 0, 0); },
};

// --------- music ---------
const mtof = m => 440*Math.pow(2, (m-69)/12);
const MO = ()=> Snd.mfade;
const INST = {
  ep(t,d,f,v){ const dd = Math.max(.4, d*1.25); osc('sine', f, t, dd, v*.55, MO(), {a:.006, r:dd}); osc('sine', f*2, t, dd*.5, v*.12, MO(), {a:.004, r:dd*.5}); osc('triangle', f, t, dd*.35, v*.1, MO(), {a:.004, r:dd*.35}); },

const Music = {
  cur:null, target:undefined, step:0, nextT:0, timer:null, swT:null, mel:{}, want:null, bpmMul:1,
  boot(){
    if (this.timer) return;
    this.timer = setInterval(()=>this.tick(), 25);
    if (this.want !== null){ const w = this.want; this.want = null; this.set(w); }
  },
  set(id){
    if (!Snd.ok){ this.want = id; return; }
    if (id === this.target) return;
    this.target = id;
    clearTimeout(this.swT);
    const c = Snd.ctx, g = Snd.mfade.gain, now = c.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
    if (id === this.cur && id){ g.linearRampToValueAtTime(1, now + .4); return; }
    g.linearRampToValueAtTime(0, now + .55);
    this.swT = setTimeout(()=>{
      this.cur = this.target || null; this.step = 0; this.nextT = Snd.ctx.currentTime + .08;
      const n = Snd.ctx.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(0, n);
      if (this.cur) g.linearRampToValueAtTime(1, n + 1.1);
    }, this.cur ? 600 : 30);
  },
  melody(id, tr){
    if (this.mel[id]) return this.mel[id];
    const r = mulberry32(tr.lead.seed), scale = tr.scale || MAJ;
    const bars = tr.chords.length*2, notes = new Array(bars*16).fill(null);
    const pool = []; for (let m=tr.lead.lo; m<=tr.lead.hi; m++) if (scale.includes(m%12)) pool.push(m);
    let cur = pool[Math.floor(pool.length/2)];
    const RH = [[0,4,8,12],[0,6,8,12,14],[0,3,6,8,11,14],[0,8],[0,2,4,8,10,12],[0,6,10],[2,4,6,10,12],[0,4,6,8,12]];
    for (let b=0;b<bars;b++){
      const chord = tr.chords[b % tr.chords.length].map(n=>n%12);
      let rh = RH[Math.floor(r()*RH.length)];
      if (r() > tr.lead.density + .25) rh = rh.filter((_,i)=>i%2===0);
      const endP = b % 4 === 3;
      if (endP) rh = [0,4,8].slice(0, 1 + Math.floor(r()*2));
      for (let i=0;i<rh.length;i++){
        const s = rh[i], nxt = i+1 < rh.length ? rh[i+1] : 16;
        const len = Math.min(nxt - s, endP && i === rh.length-1 ? 12 : 6);
        if (s % 8 === 0 || (endP && i === rh.length-1)){
          const cts = pool.filter(m=>chord.includes(m%12));
          if (cts.length){ let best = cts[0]; for (const m of cts) if (Math.abs(m-cur) + r()*3 < Math.abs(best-cur)) best = m; cur = best; }
        } else {
          const idx = pool.indexOf(cur), st = [-2,-1,-1,1,1,2][Math.floor(r()*6)];
          cur = pool[clamp(idx + st, 0, pool.length-1)];
        }
        notes[b*16+s] = {n:cur, len};
      }
    }
    return (this.mel[id] = {bars, notes});
  },
  tick(){
    const c = Snd.ctx; if (!c || !this.cur || c.state !== 'running') return;
    const tr = TRACKS[this.cur]; if (!tr) return;
    if (this.nextT < c.currentTime - .5) this.nextT = c.currentTime + .05;
    let guard = 0;
    while (this.nextT < c.currentTime + .15 && guard++ < 16){
      try { this.sched(this.cur, tr, this.step, this.nextT); } catch(e){}
      const sd = 60/(tr.bpm*this.bpmMul)/4, sw = this.step % 2 === 0 ? 1 + tr.swing : 1 - tr.swing;
      this.nextT += sd*sw; this.step++;
    }
  },
  sched(id, tr, step, t){
    const bar = Math.floor(step/16), s = step % 16, ci = bar % tr.chords.length;
    const chord = tr.chords[ci], root = tr.roots[ci], d16 = 60/(tr.bpm*this.bpmMul)/4, dv = tr.dv || 1;
    const dr = tr.drums || {};
    for (const k in dr) if (dr[k][s] === 'x') DRUM[k](t, dv);
    if (tr.comp) for (const hit of tr.comp.hits) if (hit[0] === s) chord.forEach((n,i)=>INST[tr.comp.inst](t + (tr.comp.strum ? i*.014 : 0), hit[1]*d16, mtof(n), tr.comp.vel));

      const mel = this.melody(id, tr), ev = mel.notes[(bar % mel.bars)*16 + s];
      if (ev) INST[tr.lead.inst](t, ev.len*d16, mtof(ev.n), tr.lead.vel);
    }
    if (tr.crackle && Math.random() < .22) nz(t + Math.random()*d16, .012, .012 + Math.random()*.02, 'highpass', 3000, .5, MO());
  },
};

  cache: new Map(), urls: new Map(),
  get(e, size){
    size = size || 16; const k = e + '@' + size; let c = this.cache.get(k); if (c) return c;
    c = mkCanvas(size, size); const x = c.getContext('2d');
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = Math.round(size*.82) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
    x.fillText(e, size/2, size/2 + size*.06);

      const id = x.getImageData(0,0,size,size), d = id.data;
      for (let i=0;i<d.length;i+=4) d[i+3] = d[i+3] < 105 ? 0 : 255;
      if (size >= 12){
        const out = new Uint8ClampedArray(d);
        for (let py=0;py<size;py++) for (let px=0;px<size;px++){
          const i = (py*size+px)*4; if (d[i+3]) continue;
          const on = (xx,yy)=> xx>=0 && yy>=0 && xx<size && yy<size && d[(yy*size+xx)*4+3] > 0;
          if (on(px-1,py) || on(px+1,py) || on(px,py-1) || on(px,py+1)){ out[i]=36; out[i+1]=26; out[i+2]=51; out[i+3]=255; }
        }

      }

    this.cache.set(k, c); return c;
  },

function makeSheet(L){
  const c = mkCanvas(SPR_W*3, SPR_H*4), x = c.getContext('2d');

function outlineCells(c, cw, chh){
  const x = c.getContext('2d'), W = c.width, H = c.height, id = x.getImageData(0,0,W,H), d = id.data, out = new Uint8ClampedArray(d);
  for (let py=0;py<H;py++) for (let px=0;px<W;px++){
    const i = (py*W+px)*4; if (d[i+3]) continue;
    const cx0 = Math.floor(px/cw)*cw, cy0 = Math.floor(py/chh)*chh;
    const on = (xx,yy)=> xx>=cx0 && yy>=cy0 && xx<cx0+cw && yy<cy0+chh && d[(yy*W+xx)*4+3] > 0;
    if (on(px-1,py) || on(px+1,py) || on(px,py-1) || on(px,py+1)){ out[i]=35; out[i+1]=26; out[i+2]=49; out[i+3]=255; }

    P(5, torsoY, 6, tH, shirt); P(5, torsoY+tH-1, 6, 1, shirtD); P(5, torsoY+tH, 6, 1, pants);
    if (L.apron && !back){ P(6, torsoY+1, 4, tH-1, L.apron); P(6, torsoY+1, 4, 1, shade(L.apron,.25)); }

    if (fr === 1){ a = 5; b = 9; } else if (fr === 2){ a = 7; b = 7; } else { a = 6; b = 8; }

const FLOOR_BASE = new Set('.,;_w-:%=usacg'.split(''));
const PROP_CH = new Set('PTLKIVAYHUZ'.split(''));
const INTERACT = new Set('SCMKIEVAYHtbUFRorZq'.split(''));

class GameMap {
  constructor(id){
    const d = MAP_DEFS[id];
    this.id = id; this.def = d; this.name = d.name; this.theme = d.theme; this.floorNo = d.floorNo || 0;
    this.h = d.rows.length; this.w = d.rows[0].length; this.tiles = d.rows.join('');
    this._store = new Array(this.w*this.h).fill(null);
    for (const sid in STORES){ const st = STORES[sid]; if (st.map !== id) continue; const [x0,y0,x1,y1] = st.rect; for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) this._store[y*this.w+x] = sid; }
    this.units = []; this._unit = new Map();
    for (let y=0;y<this.h;y++){ let x = 0; while (x < this.w){
      if (this.at(x,y) === 'S'){ const u = {store:this.storeAt(x,y), y, tiles:[], items:[], id:''}; while (x < this.w && this.at(x,y) === 'S'){ u.tiles.push(x); this._unit.set(y*this.w+x, u); x++; } u.id = y + ':' + u.tiles[0]; this.units.push(u); }
      else x++; } }
    const by = {}; for (const u of this.units) if (u.store) (by[u.store] = by[u.store] || []).push(u);
    for (const sid in by){ const us = by[sid], items = STORES[sid].items;
      us.forEach((u,ui)=>{ if (items.length >= us.length) items.forEach((it,i)=>{ if (i % us.length === ui) u.items.push(it); }); else if (items.length) u.items.push(items[ui % items.length]); }); }
    this.stalls = STALLS.filter(s=>s.map === id);
    this.props = []; this.esc = []; this.slots = []; this.lights = []; this.fountain = null; this.radio = null;
    for (let y=0;y<this.h;y++) for (let x=0;x<this.w;x++){
      const ch = this.at(x,y);
      if (PROP_CH.has(ch)){ const a = Art.prop(ch, this, x, y); if (a){ const pr = {img:a.img, x:x*16+a.ox, y:y*16+a.oy, sortY:(y+1)*16-2+(a.sortDy||0), tx:x, ty:y, ch, screen:a.screen}; this.props.push(pr);
        if (a.light) this.lights.push({x:x*16+a.light.dx, y:y*16+a.light.dy, r:a.light.r, col:a.light.col}); } }
      if (ch === '^' || ch === 'v') this.esc.push({x, y, ch});
      if (ch === 'o') this.slots.push({x, y});
      if (ch === 'r') this.radio = {x, y};
      if (ch === 'F' && !this.fountain){ const b = this.block(x,y,'F'); this.fountain = {x:x*16, y:y*16, w:b.w*16, h:b.h*16}; }
      if (id === 'street'){
        if (ch === 'W') this.lights.push({x:x*16+8, y:y*16+8, r:16, col:'255,210,130'});
        if (ch === 'G') this.lights.push({x:x*16+8, y:y*16+10, r:20, col:'255,220,170'});
        if (ch === 'D') this.lights.push({x:x*16+8, y:y*16+12, r:24, col:'255,226,170'});
      }
    }
    if (id === 'street') this.lights.push({x:34*16, y:2*16, r:56, col:'255,95,162'});
    this.walk = [];
    for (let y=0;y<this.h;y++) for (let x=0;x<this.w;x++){ const ch = this.at(x,y); if (FLOOR_BASE.has(ch) && !this.warpAt(x,y)) this.walk.push([x,y]); }
    this.signPos = {};
    this.canvas = Art.render(this);
  }
  at(x,y){ return (x<0 || y<0 || x>=this.w || y>=this.h) ? 'x' : this.tiles[y*this.w+x]; }
  solid(x,y){ return !WALK.has(this.at(x,y)); }
  storeAt(x,y){ return (x<0 || y<0 || x>=this.w || y>=this.h) ? null : this._store[y*this.w+x]; }
  unitAt(x,y){ return this._unit.get(y*this.w+x) || null; }
  under(x,y){
    const ch = this.at(x,y); if (WALLISH.has(ch) || ch === 'y') return null;
    for (const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1],[1,1],[-1,1]]){ const c = this.at(x+dx,y+dy); if (FLOOR_BASE.has(c)) return c; }
    return this.def.floor;
  }
  block(x,y,ch){ let w = 0; while (this.at(x+w,y) === ch) w++; let hh = 0; while (this.at(x,y+hh) === ch) hh++; return {w, h:hh}; }
  stallAt(x,y){ return this.stalls.find(s=>s.y === y && x >= s.x && x <= s.x+2) || null; }
  warpAt(x,y){ return (this.def.warps||[]).find(w=>x >= w.x && x < w.x+w.w && y >= w.y && y < w.y+w.h) || null; }
}

function keeperLook(name, color){ const L = randLook(srand('k', name)); L.apron = color; L.bag = null; return L; }

const World = {
  maps:{}, map:null, player:null, ents:[], cars:[], cam:{x:0,y:0}, t:0, warpCD:0, region:null, target:null, stepT:0, carT:2,

  getMap(id){ return this.maps[id] || (this.maps[id] = new GameMap(id)); },
  setView(vw, vh){ this.vw = vw; this.vh = vh; this.lightCv = mkCanvas(vw, vh); },
  enter(mapId, px, py, dir){
    this.map = this.getMap(mapId);

    const p = this.player; p.x = px; p.y = py; p.dir = dir || 0; p.fr = 0;
    this.fixPos(p);
    this.spawnNPCs(); this.cars = []; this.carT = 1.5; this.warpCD = .6;

    this.snapCam();
    Game.onEnterMap(mapId);
  },
  fixPos(p){
    if (this.canStand(p.x, p.y, 5)) return;
    for (let r=1;r<64;r++) for (const [dx,dy] of [[0,r],[0,-r],[r,0],[-r,0],[r,r],[-r,r],[r,-r],[-r,-r]]) if (this.canStand(p.x+dx, p.y+dy, 5)){ p.x += dx; p.y += dy; return; }
  },
  canStand(x, y, hw){
    const m = this.map, x0 = Math.floor((x-hw)/16), x1 = Math.floor((x+hw-.01)/16), y0 = Math.floor((y-5)/16), y1 = Math.floor((y-.01)/16);
    for (let ty=y0;ty<=y1;ty++) for (let tx=x0;tx<=x1;tx++) if (m.solid(tx,ty)) return false;
    return true;
  },
  mkNPC(kind, x, y, dir, look, name, extra){ return Object.assign({kind, x, y, dir:dir||0, fr:0, anim:0, look, name, wait:Math.random()*2, tx:null, axis:0, stuck:0, moving:false}, extra||{}); },
  spawnNPCs(){
    const m = this.map, ents = [];
    for (const sid in STORES){ const st = STORES[sid]; if (st.map !== m.id || !st.keeper) continue;
      ents.push(this.mkNPC('keeper', st.keeper.x*16+8, st.keeper.y*16+14, st.keeper.dir, keeperLook(st.keeper.name, st.color), st.keeper.name, {store:sid})); }
    for (const stl of m.stalls) ents.push(this.mkNPC('vendor', stl.x*16+24, (stl.y-1)*16+14, 0, null, '', {stall:stl}));
    for (const t of TOWNS) if (t.map === m.id) ents.push(this.mkNPC('town', t.x*16+8, t.y*16+14, 0, t.look, t.name, {town:t.id}));
    if (m.id === 'mall1') ents.push(this.mkNPC('guard', 21*16+8, 17*16+14, 0, {skin:'#d79f78',hair:'#2b2230',style:3,shirt:'#2f3e6e',pants:'#2f3e6e',shoe:'#1f1a2a',capc:'#1f2a4e'}, 'Gus'));
    if (m.id === 'street'){
      ents.push(this.mkNPC('busker', 40*16+8, 18*16+14, 0, {skin:'#b07a54',hair:'#c8622e',style:1,shirt:'#9bde7e',pants:'#5a4636',shoe:'#7a4b33'}, 'Juno'));
      ents.push(this.mkNPC('vera', 7*16+8, 25*16+14, 3, {skin:'#eebd9b',hair:'#c9c3d3',style:2,shirt:'#7b2d4f',pants:'#3b3b58',shoe:'#3b3048',bag:'#d4a043'}, 'Vera'));
    }
    if (m.id === 'mall2') ents.push(this.mkNPC('kid', 29*16+8, 21*16+14, 0, {skin:'#d79f78',hair:'#2b2230',style:0,shirt:'#ffd04d',pants:'#2f4b7c',shoe:'#c8443a',kid:true}, 'Milo'));
    if (m.id === 'mall3') ents.push(this.mkNPC('dad', 12*16+8, 21*16+14, 0, {skin:'#d79f78',hair:'#2b2230',style:0,shirt:'#5bc0be',pants:'#3b3b58',shoe:'#3b3048'}, 'Mr. Ito'));
    const n = m.id === 'street' ? 9 : m.id === 'home' ? 0 : 7;
    for (let i=0;i<n;i++){
      const spot = pick(m.walk); if (!spot) break;
      ents.push(this.mkNPC('shopper', spot[0]*16+8, spot[1]*16+14, 0, randLook(), 'Shopper', {sid:Math.random().toString(36).slice(2,8)}));
    }

  },
  snapCam(){ const c = this.camTarget(); this.cam.x = c.x; this.cam.y = c.y; },
  camTarget(){
    const m = this.map, p = this.player, W = m.w*16, H = m.h*16;
    let x = p.x - this.vw/2, y = p.y - 10 - this.vh/2;
    x = W <= this.vw ? (W - this.vw)/2 : clamp(x, 0, W - this.vw);
    y = H <= this.vh ? (H - this.vh)/2 : clamp(y, 0, H - this.vh);
    return {x, y};
  },
  update(dt){
    this.t += dt; this.dt = dt;
    if (this.warpCD > 0) this.warpCD -= dt;
    Game.tick(dt);
    if (!this.map || Game.mode !== 'play') return;
    this.updatePlayer(dt);
    while (Input.q.length){ const a = Input.q.shift(); this.onAction(a); if (UI.isOpen()) { Input.q.length = 0; break; } }
    for (const e of this.ents) if (e.kind === 'shopper' && Game.npcVisible(e)) this.updateShopper(e, dt);
    this.updateCars(dt);
    const c = this.camTarget(), k = Math.min(1, dt*7); this.cam.x += (c.x - this.cam.x)*k; this.cam.y += (c.y - this.cam.y)*k;
    this.target = this.findTarget();
    Game.ambience();
  },
  onAction(a){
    if (a === 'act'){ if (this.target) Game.interact(this.target); }
    else if (a === 'bag') UI.inventory();
    else if (a === 'list') UI.listPanel();
    else if (a === 'map') UI.mapPanel();
    else if (a === 'pause') UI.pause();
    else if (a === 'book') UI.catalog();
  },
  updatePlayer(dt){
    const p = this.player, v = Input.vec();
    let sp = 58; if (Game.s.energy < 15) sp *= .72; if (this.map.id === 'street' && Game.s.flags.bike) sp *= 1.55;
    const pk = Game.perks(); sp *= 1 + pk.speed + (this.map.def.outdoor ? pk.speedOut : 0);
    if (v.x || v.y){
      const dx = v.x*sp*dt, dy = v.y*sp*dt;
      if (dx){
        if (this.canStand(p.x+dx, p.y, 5)) p.x += dx;
        else if (Math.abs(v.x) > .5) for (const off of [2,-2,4,-4,6,-6,8,-8]) if (this.canStand(p.x+dx, p.y+off, 5) && this.canStand(p.x, p.y+off, 5)){ p.y += Math.sign(off)*Math.min(Math.abs(off), sp*dt); break; }
      }
      if (dy){
        if (this.canStand(p.x, p.y+dy, 5)) p.y += dy;
        else if (Math.abs(v.y) > .5) for (const off of [2,-2,4,-4,6,-6,8,-8]) if (this.canStand(p.x+off, p.y+dy, 5) && this.canStand(p.x+off, p.y, 5)){ p.x += Math.sign(off)*Math.min(Math.abs(off), sp*dt); break; }
      }
      p.dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x < 0 ? 1 : 2) : (v.y < 0 ? 3 : 0);
      p.anim += dt*(sp/6); p.fr = [1,0,2,0][Math.floor(p.anim) % 4]; p.moving = true;
      this.stepT -= dt;
      if (this.stepT <= 0){ this.stepT = this.map.id === 'street' && Game.s.flags.bike ? .5 : .3; Snd.play(this.stepSound()); }
      for (const e of this.ents) if (e.kind === 'shopper'){ const ddx = e.x - p.x, ddy = e.y - p.y, d = Math.hypot(ddx,ddy); if (d < 10 && d > .01){ const nx = e.x + ddx/d*1.5, ny = e.y + ddy/d*1.5; if (this.canStand(nx, ny, 4)){ e.x = nx; e.y = ny; } } }
    } else { p.fr = 0; p.moving = false; this.stepT = 0; }
    const tx = Math.floor(p.x/16), ty = Math.floor((p.y-2)/16);
    const sid = this.map.storeAt(tx, ty);
    if (sid !== this.region){ const old = this.region; this.region = sid; Game.onRegion(old, sid); }
    if (this.warpCD <= 0){ const w = this.map.warpAt(tx, ty); if (w) Game.tryWarp(w); }
  },
  stepSound(){
    const p = this.player, ch = this.map.at(Math.floor(p.x/16), Math.floor((p.y-2)/16));
    if (':%u'.includes(ch)) return 'step_carpet';
    if (ch === 'w') return 'step_wood';
    if ('sacz'.includes(ch)) return 'step_out';
    if (ch === 'g') return 'step_grass';
    return 'step_tile';
  },
  updateShopper(e, dt){
    if (e.wait > 0){ e.wait -= dt; e.moving = false; e.fr = 0; return; }
    if (e.tx == null){ const s = pick(this.map.walk); if (!s){ e.wait = 3; return; } e.tx = s[0]; e.ty = s[1]; e.axis = Math.random() < .5 ? 0 : 1; }
    const gx = e.tx*16+8, gy = e.ty*16+12, dx = gx - e.x, dy = gy - e.y;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2){ e.tx = null; e.wait = 1 + Math.random()*4; e.moving = false; e.fr = 0; return; }
    const sp = 24*dt; let mx = 0, my = 0;
    if (e.axis === 0){ if (Math.abs(dx) >= 2) mx = Math.sign(dx)*Math.min(sp, Math.abs(dx)); else e.axis = 1; }
    else { if (Math.abs(dy) >= 2) my = Math.sign(dy)*Math.min(sp, Math.abs(dy)); else e.axis = 0; }
    if (!mx && !my) return;
    const nx = e.x + mx, ny = e.y + my;
    if (this.canStand(nx, ny, 4) && !this.map.warpAt(Math.floor(nx/16), Math.floor((ny-2)/16))){
      e.x = nx; e.y = ny; e.stuck = 0; e.moving = true; e.dir = mx < 0 ? 1 : mx > 0 ? 2 : my < 0 ? 3 : 0; e.anim += dt*4; e.fr = [1,0,2,0][Math.floor(e.anim) % 4];
    } else { e.stuck += dt; e.axis = 1 - e.axis; if (e.stuck > .5){ e.tx = null; e.stuck = 0; e.wait = .4; } }
  },
  updateCars(dt){
    if (this.map.id !== 'street') return;
    this.carT -= dt;
    if (this.carT <= 0 && this.cars.length < 3){
      this.carT = 4 + Math.random()*7; const lane = Math.random() < .5 ? 0 : 1, col = pick(['#ef5b5b','#5bc0be','#f2e863','#6c7ee1','#f5f0e6','#ff9a76','#9bde7e']);
      const W = this.map.w*16;
      this.cars.push({lane, x: lane === 0 ? W + 20 : -20, y: lane === 0 ? 10*16+8 : 12*16+8, vx: lane === 0 ? -48 - Math.random()*14 : 48 + Math.random()*14, img: Art.car(col), honked:false});
    }
    const p = this.player;
    for (const c of this.cars){
      const dirx = Math.sign(c.vx), ahead = (p.x - c.x)*dirx;
      const blocked = Math.abs((p.y - 5) - c.y) < 11 && ahead > 0 && ahead < 38;
      if (blocked){ if (!c.honked){ c.honked = true; Snd.playAt('honk', c.x, c.y); } }
      else { c.x += c.vx*dt; if (ahead < 0) c.honked = false; }
    }
    const W = this.map.w*16; this.cars = this.cars.filter(c=>c.x > -40 && c.x < W + 40);
  },
  findTarget(){
    const p = this.player, [dx,dy] = DIRV[p.dir], fx = p.x + dx*13, fy = p.y - 4 + dy*13;
    let best = null, bd = 15;
    for (const e of this.ents){ if (!Game.npcVisible(e)) continue; const d = Math.hypot(e.x - fx, (e.y-4) - fy); if (d < bd){ bd = d; best = {kind:'npc', e}; } }
    if (best) return best;
    const tx = Math.floor(fx/16), ty = Math.floor(fy/16), ch = this.map.at(tx, ty);
    if (INTERACT.has(ch)){
      if (ch === 'M' && !Game.stallSeller(this.map.stallAt(tx,ty))) return null;
      return {kind:'tile', ch, tx, ty};
    }
    return null;
  },
  // ---------- drawing ----------
  draw(ctx){
    const m = this.map, vw = this.vw, vh = this.vh;
    ctx.fillStyle = '#0d0914'; ctx.fillRect(0,0,vw,vh);
    const cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
    ctx.drawImage(m.canvas, -cx, -cy);
    this.drawDynamic(ctx, cx, cy);
    const list = [];
    const inView = (x,y)=> x > cx - 60 && x < cx + vw + 60 && y > cy - 40 && y < cy + vh + 70;
    for (const pr of m.props) if (inView(pr.x, pr.y)) list.push({y:pr.sortY, f:()=>this.drawProp(ctx, pr, cx, cy)});
    for (const stl of m.stalls) list.push({y:(stl.y+1)*16-1, f:()=>this.drawStall(ctx, stl, cx, cy)});
    for (const e of this.ents) if (Game.npcVisible(e) && inView(e.x, e.y)) list.push({y:e.y, f:()=>this.drawNPC(ctx, e, cx, cy)});
    for (const c of this.cars) list.push({y:c.y+7, f:()=>{ const img = c.img; ctx.save(); ctx.translate(Math.round(c.x - cx), Math.round(c.y - cy)); if (c.vx < 0) ctx.scale(-1,1); ctx.fillStyle = 'rgba(20,10,40,.3)'; ctx.fillRect(-13,6,26,3); ctx.drawImage(img, -14, -7); ctx.restore(); }});
    list.push({y:this.player.y + .1, f:()=>this.drawPlayer(ctx, cx, cy)});
    list.sort((a,b)=>a.y - b.y);
    for (const d of list) d.f();
    for (const e of this.ents) if (Game.npcVisible(e)) this.drawBadge(ctx, e, cx, cy);
    if (m.def.outdoor) this.drawWeather(ctx, vw, vh);
    this.drawLighting(ctx, cx, cy);
    this.drawPrompt(ctx, cx, cy);
  },

  // ---------- list, requests, jobs ----------
  listCheck(id){

    const i = L.items.findIndex((x,k)=>x === id && !L.done[k]); if (i < 0) return;

    if (L.done.every(Boolean)){ L.rewarded = true; this.earn(1500); this.addRep(1); let msg = 'Gran\'s list is done! She sent you ' + money(1500) + '.';
      if (rnd('cpn', this.s.seed, this.s.day) < .35){ this.s.coupons++; msg += ' Plus a coupon!'; }
      UI.toast(msg, '💝', 'special'); Snd.play('levelup'); }
  },
  makeRequest(t, r){
    const s = this.s, type = pick(['item','item','food','gift'], r), base = {id:'q' + s.day + t.id, npc:t.id, type, day:s.day, done:false};
    if (type === 'item'){ const it = pick(REQ_POOL, r); return Object.assign(base, {item:it, reward:Math.round(ITEMS[it].price*1.35) + 400}); }
    if (type === 'food') return Object.assign(base, {reward:600});
    return Object.assign(base, {budget:pick([1500,2500,4000], r), reward:900});
  },
  reqFor(tid){ return this.s.requests.find(q=>q.npc === tid && !q.done) || null; },
  reqText(q){
    if (q.type === 'item') return 'Could you bring me ' + ITEMS[q.item].name.toLowerCase() + '? I\'ll pay you back with a little extra.';
    if (q.type === 'food') return 'I\'m starving and can\'t leave my spot. Could you bring me anything to eat?';
    return 'It\'s my friend\'s birthday. Could you find a gift that costs under ' + money(q.budget) + '?';
  },
  reqShort(q){ return q.type === 'item' ? ITEMS[q.item].name : q.type === 'food' ? 'something to eat' : 'a gift under ' + money(q.budget); },
  reqMatches(q){
    const inv = Object.keys(this.s.inv).filter(id=>this.s.inv[id] > 0 && !ITEMS[id].special);
    if (q.type === 'item') return inv.filter(id=>id === q.item);
    if (q.type === 'food') return inv.filter(isFood).sort((a,b)=>ITEMS[a].price - ITEMS[b].price);
    return inv.filter(id=>ITEMS[id].gift && ITEMS[id].price <= q.budget).sort((a,b)=>ITEMS[a].price - ITEMS[b].price);
  },
  fulfill(q, id){
    const it = ITEMS[id]; if (!this.removeItem(id)) return;
    const reward = q.type === 'item' ? q.reward : q.reward + Math.round(it.price*1.1);
    this.earn(reward); q.done = true; this.addRep(1); this.befriend(q.npc, 2, false);
    Snd.play('coin'); UI.toast('Gave ' + it.name + '. You earned ' + money(reward) + '.', it.emoji, 'money');
  },
  reqHint(q){
    if (q.type !== 'item') return q.type === 'food' ? 'Snacks are everywhere: the market, Sunny Mart, the food court.' : 'Look for gift-tagged items in shops.';
    const pm = this.s.prices[q.item]; if (pm) return 'You saw it for ' + money(pm.p) + ' at ' + pm.w + '.';
    for (const id in SELLERS) if (SELLERS[id].items.includes(q.item)) return 'Try ' + SELLERS[id].name + '.';
    return '';
  },
  jobInfo(type){ return type === 'flyers' ? {t:'Hand out flyers', d:'Give flyers to 6 shoppers within 3 hours.'} : type === 'stock' ? {t:'Restock Sunny Mart', d:'Restock 5 marked shelves at Sunny Mart (floor 1).'} : {t:'Delivery run', d:'Pick up a parcel from one shop and drop it at another.'}; },
  deliveryCandidates(){
    const out = [];
    if (this.mallOpen()) for (const id in STORES){ const st = STORES[id]; if (st.keeper && st.kind === 'shop' && (st.map !== 'mall3' || this.s.flags.f3)) out.push({id, map:st.map}); }
    for (const stl of STALLS){ const sel = this.stallSeller(stl); if (sel && (!stl.mall || this.s.flags.f3) && !sel.food) out.push({id:sel.id, map:stl.map}); }
    return out;
  },
  acceptJob(j){
    const s = this.s; if (s.job) return 'Finish or quit your current job first.';
    if (s.jobsDone.includes(j.id)) return 'You already did that one today.';
    if (j.type === 'stock'){
      if (!this.mallOpen()) return 'Sunny Mart is closed right now.';
      const units = World.getMap('mall1').units.filter(u=>u.store === 'sm');
      s.job = {type:'stock', id:j.id, pay:j.pay, store:'sm', marks:shuffle(units).slice(0,5).map(u=>u.id), done:0, target:5};
    } else if (j.type === 'flyers'){
      if (s.min > 1260) return 'Too late for flyers today.';
      s.job = {type:'flyers', id:j.id, pay:j.pay, count:0, target:6, until:Math.min(1430, s.min + 180)};
    } else {
      const c = this.deliveryCandidates(); if (c.length < 2) return 'No deliveries right now. Try during mall or market hours.';
      const from = pick(c), others = c.filter(x=>x.id !== from.id), far = others.filter(x=>x.map !== from.map), to = pick(far.length ? far : others);
      s.job = {type:'deliver', id:j.id, pay:j.pay, from:from.id, to:to.id, stage:0};
    }
    Snd.play('select'); return null;
  },
  quitJob(){ this.s.job = null; UI.hud(); },
  finishJob(){
    const s = this.s, j = s.job; if (!j) return;
    this.earn(j.pay); s.jobsDone.push(j.id); s.job = null; this.addRep(1);
    Snd.play('levelup'); UI.toast('Job complete! You earned ' + money(j.pay) + '.', '💼', 'money');
  },
  jobText(j){
    if (!j) return '';
    if (j.type === 'flyers') return 'Flyers: ' + j.count + '/' + j.target + ' handed out. Ends at ' + fmtTime(j.until) + '. Talk to shoppers to hand them out.';
    if (j.type === 'stock') return 'Restock: ' + j.done + '/' + j.target + ' shelves at Sunny Mart. Look for the sparkles.';
    return j.stage === 0 ? 'Pick up the parcel from ' + this.sellerName(j.from) + '.' : 'Deliver the parcel to ' + this.sellerName(j.to) + '.';
  },
  deliveryHook(who){
    const j = this.s.job; if (!j || j.type !== 'deliver' || !who) return false;
    if (j.stage === 0 && who === j.from){
      if (this.space() <= 0){ UI.toast('Make room in your bag for the parcel first.', '📦', 'warn'); return true; }
      this.s.inv.parcel = (this.s.inv.parcel || 0) + 1; j.stage = 1; Snd.play('bag');
      UI.say(this.sellerName(who), 'Here\'s the parcel. It\'s for ' + this.sellerName(j.to) + '. Handle with care!', SELLERS[who].color || '#3b3552'); return true;
    }
    if (j.stage === 1 && who === j.to){ this.removeItem('parcel'); UI.say(this.sellerName(who), 'Oh, my parcel! Thank you so much.', SELLERS[who].color || '#3b3552'); this.finishJob(); return true; }

  // ---------- NPCs ----------
  npcVisible(e){
    const s = this.s; if (!s) return false;
    switch (e.kind){
      case 'keeper': case 'guard': return true;
      case 'vendor': return !!this.stallSeller(e.stall);
      case 'town': { const q = this.reqFor(e.town), map = (TOWNS.find(t=>t.id === e.town) || {}).map; return !!q && s.min >= 540 && s.min < 1200 && (map === 'street' || this.mallOpen()); }
      case 'busker': return s.weather !== 'rain' && s.min >= 600 && s.min < 1260;
      case 'vera': return this.isWeekend() && s.min >= 480 && s.min < 1080;
      case 'kid': return s.flags.kid === 1 || s.flags.kid === 2;
      case 'dad': return s.flags.kid === 2;
      case 'shopper': {
        if (World.map.id !== 'street') return true;
        const rv = (e.sid.charCodeAt(0) % 10)/10, busy = (s.min < 420 || s.min >= 1380) ? .15 : (s.weather === 'rain' ? .35 : (s.min >= 1200 && !this.nightMarket() ? .4 : 1));
        return rv < busy;

    }
    return true;
  },
  entSeller(e){ if (e.kind === 'keeper') return e.store; if (e.kind === 'vendor'){ const sel = this.stallSeller(e.stall); return sel ? sel.id : null; } return null; },
  npcBadge(e){
    const s = this.s, j = s.job;
    if (e.kind === 'town' && this.reqFor(e.town)) return {ch:'!', col:'#ffd04d'};
    if (e.kind === 'kid' && s.flags.kid === 1) return {ch:'?', col:'#ff8fb8'};
    if (e.kind === 'dad' && s.flags.kid === 2) return {ch:'!', col:'#ff8fb8'};
    if (j && j.type === 'deliver'){ const who = this.entSeller(e); if (who && ((j.stage === 0 && who === j.from) || (j.stage === 1 && who === j.to))) return {ch:'$', col:'#7ee0a1'}; }
    return null;
  },
  talk(e){
    const s = this.s, j = s.job;
    if (this.deliveryHook(this.entSeller(e))) return;
    if (j && j.type === 'flyers' && e.kind === 'shopper' && !s.flyered[e.sid]){
      s.flyered[e.sid] = 1; j.count++; Snd.play('flyer'); UI.toast('Handed out a flyer (' + j.count + '/' + j.target + ')', '📄');
      if (j.count >= j.target) this.finishJob(); return;
    }
    switch (e.kind){
      case 'keeper': return STORES[e.store].kind === 'cinema' ? UI.cinema() : UI.checkout(e.store);
      case 'vendor': { const sel = this.stallSeller(e.stall); if (sel) UI.stall(sel); return; }
      case 'town': return UI.request(e);
      case 'guard': return UI.say('Gus, security', pick(GUS_LINES), '#2f3e6e');
      case 'busker': return UI.say('Juno', pick(BUSKER_LINES), '#2a9d8f', [{label:'Tip ' + money(100), fn:()=>{ if (s.cash < 100) return UI.toast('You\'re out of cash.', '🪙', 'warn'); this.spendFlat(100); Snd.playAt('guitar', e.x, e.y); this.befriend('juno', 1, true); UI.toast('Juno plays you a little riff.', '🎸'); }}, {label:'Just listening'}]);
      case 'vera': return UI.say('Vera', pick(VERA_LINES), '#7b2d4f');

        if (s.flags.kid === 1){ s.flags.kid = 2; return UI.say('Milo', 'I can\'t find my dad! He said he was getting noodles… upstairs, I think?', '#ff8fb8'); }
        return UI.say('Milo', 'Did you find my dad? He likes noodles a LOT.', '#ff8fb8');

  interact(t){
    if (t.kind === 'npc') return this.talk(t.e);

      case 'S': return this.shelf(m.unitAt(tx, ty));
      case 'C': { const sid = m.storeAt(tx, ty); if (!sid) return; if (this.deliveryHook(sid)) return; return STORES[sid].kind === 'cinema' ? UI.cinema() : UI.checkout(sid); }

      case 'I': return UI.mapPanel();
      case 'E': return UI.elevator();
      case 'V': return UI.stall(SELLERS.vend);

  shelf(u){
    if (!u) return; const j = this.s.job;

  },
};

const Fun = {
  arcade(k){
    const s = Game.s; if (s.cash < 100) return UI.toast('You need ' + money(100) + ' to play.', '🪙', 'warn');
    const name = ARCADE_GAMES[k % ARCADE_GAMES.length]; Game.spendFlat(100); Snd.play('arcade');
    const score = Math.floor(80 + Math.random()*2400)*100, best = score > s.stats.arcadeBest; if (best) s.stats.arcadeBest = score;
    s.energy = Math.max(0, s.energy - 2);

  },
  rest(mins, en, msg){ UI.fadeTo(()=>{ Game.advance(mins); Game.s.energy = Math.min(100, Game.s.energy + en); UI.toast(msg + ' +' + en + ' energy', '🪑'); UI.hud(); }, null, .35); },
  wish(){
    const s = Game.s; if (s.cash < 25) return UI.toast('You need a quarter to make a wish.', '🪙', 'warn');
    Game.spendFlat(25); Snd.play('splash'); s.luck = true;

  },
};

    const play = this.btn('Play', ()=>{
      if (s.cash < 200){ Snd.play('error'); return this.toast('You need ' + money(200) + '.', '🪙', 'warn'); }
      if (Game.space() <= 0){ Snd.play('error'); return this.toast('Your bag is full.', '🎒', 'warn'); }
      Game.spendFlat(200); play.disabled = true; Snd.play('claw'); arm.style.left = (20 + Math.random()*60) + '%'; arm.style.height = '82px';
      setTimeout(()=>{ Snd.play('thud'); arm.style.height = '20px';
        setTimeout(()=>{ const r = Math.random(); if (r < .25){ const prize = r < .03 ? 'plushunicorn' : pick(['plushfox','plushfrog','plushocto']); Game.addItem(prize); Snd.play('win'); msg.textContent = 'You won a ' + ITEMS[prize].name + '!'; }
          else { Snd.play('bonk'); msg.textContent = 'So close! The claw slipped.'; } play.disabled = false; UI.hud(); }, 800); }, 1000);
    }, 'pink');
    foot.append(h('span', {class:'grow note'}, 'Cash ' + money(s.cash)), play);
  },
  photo(){
    const s = Game.s;
    this.confirm('Photo booth', 'Four poses, one strip, ' + money(300) + '. The strip makes nice decor.', 'Take photos', ()=>{
      if (s.cash < 300){ Snd.play('error'); return this.toast('You need ' + money(300) + '.', '🪙', 'warn'); }
      if (Game.space() <= 0){ Snd.play('error'); return this.toast('Your bag is full.', '🎒', 'warn'); }
      Game.spendFlat(300); this.closePanel(true); const f = $('#fade'); let n = 0;
      const flash = ()=>{ Snd.play('flash'); f.style.background = '#ffffff'; f.style.transition = 'none'; f.classList.add('on'); setTimeout(()=>{ f.style.transition = ''; f.classList.remove('on'); if (++n < 4) setTimeout(flash, 450); else { setTimeout(()=>{ f.style.background = ''; }, 400); Game.addItem('photostrip'); this.toast('Your photo strip is ready!', '🎞️'); } }, 90); };
      flash();
    });
  },
  decor(i){
    if (i < 0) return; const s = Game.s, cur = s.decor[i], ids = Object.keys(s.inv).filter(id=>s.inv[id] > 0 && ITEMS[id].decor);
    const {body} = this.panel({title:'Display shelf, spot ' + (i+1), sub:'Decor helps you rest: +5 energy each when you sleep.', icon:'🖼️', kind:'decor'});
    if (cur) body.append(h('div', {class:'detail px'}, Icons.img(ITEMS[cur].emoji), h('div', {class:'nm'}, h('b', null, ITEMS[cur].name), h('div', {class:'note', style:{margin:0}}, 'On display')),
      h('div', {class:'acts'}, this.btn('Take back', ()=>{ if (Game.space() <= 0) return this.toast('Your bag is full.', '🎒', 'warn'); s.decor[i] = null; Game.addItem(cur); Snd.play('bag'); this.decor(i); }, 'ghost'))));
    if (!ids.length) body.append(h('p', {class:'note'}, 'You have no decor in your bag. Look for items tagged decor: plants, plushies, lamps, records and more.'));
    for (const id of ids) body.append(this.row(ITEMS[id].emoji, ITEMS[id].name, ITEMS[id].cat, null, [this.btn(cur ? 'Swap in' : 'Place', ()=>{ Game.removeItem(id); if (cur) Game.addItem(cur); s.decor[i] = id; Snd.play('pickup'); this.toast(ITEMS[id].name + ' looks great there.', ITEMS[id].emoji); this.closePanel(); })]));
  },
  decorPick(id, back){
    const s = Game.s, {body} = this.panel({title:'Display ' + ITEMS[id].name, sub:'Pick a spot on your display shelf.', icon:ITEMS[id].emoji, kind:'decor', back});
    s.decor.forEach((cur, i)=>body.append(this.row(cur ? ITEMS[cur].emoji : null, 'Spot ' + (i+1) + ': ' + (cur ? ITEMS[cur].name : 'empty'), cur ? 'Goes back into your bag' : null, null,
      [this.btn(cur ? 'Swap' : 'Place', ()=>{ if (!Game.removeItem(id)) return; if (cur) Game.addItem(cur); s.decor[i] = id; Snd.play('pickup'); this.toast(ITEMS[id].name + ' looks great there.', ITEMS[id].emoji); this.closePanel(); })])));
  },
  radio(){
    const s = Game.s, {body} = this.panel({title:'Radio', sub:'Buy tapes at Tune Town or Second Spin to add songs.', icon:'📻', kind:'radio'});
    const opts = [['off','Off']].concat(Object.keys(s.tapes).filter(k=>TRACKS[k]).map(k=>[k, TRACK_NAMES[k] || k]));
    for (const [k, l] of opts) body.append(h('button', {class:'mline', onclick:()=>{ s.radio = k; Game.music(); this.radio(); }}, h('span', null, l), h('span', {class:'ld'}), h('span', {class:'k'}, s.radio === k ? 'PLAYING' : '')));
  },
  sleep(){
    const s = Game.s, early = s.min < 18*60;
    this.confirm('Go to sleep?', (early ? 'It\'s only ' + fmtTime(s.min) + '. ' : '') + 'You\'ll wake up at 08:00 tomorrow and the game will save. Decor on your shelf helps you rest.', 'Sleep', ()=>{ this.closePanel(true); Game.sleep(); });
  },
  request(e){
    const q = Game.reqFor(e.town); if (!q) return; const t = TOWNS.find(x=>x.id === e.town), matches = Game.reqMatches(q).slice(0,3);
    const opts = matches.map(id=>({label:'Give ' + ITEMS[id].name, cls:'pink', fn:()=>Game.fulfill(q, id)}));
    opts.push({label:matches.length ? 'Not yet' : 'I\'ll look', cls:'ghost'});
    const reward = q.type === 'item' ? ' Reward: ' + money(q.reward) + '.' : '';
    this.say(t.name, Game.reqText(q) + reward + (matches.length ? '' : ' ' + Game.reqHint(q)), '#c94f7c', opts);
  },
};
// ================= saves =================
function b64e(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(bin); }
function b64d(b){ const bin = atob(b.replace(/\s+/g, '')); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }

const Save = {
  key(n){ return 'plazadays.slot' + n; },
  read(n){
    for (const k of [this.key(n), this.key(n) + '.bak']){
      const raw = LS.get(k); if (!raw) continue;
      try { const p = JSON.parse(raw); if (p && p.data && p.meta){ JSON.parse(p.data); return p; } } catch(e){}
    }
    return null;
  },
  latest(){ let best = null; for (const n of [1,2,3]){ const p = this.read(n); if (p && (!best || p.savedAt > best.p.savedAt)) best = {n, p}; } return best; },
  thumb(){
    try {
      const src = $('#view'), c = mkCanvas(96, 54), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      const r = Math.max(96/src.width, 54/src.height), w = src.width*r, hh = src.height*r;
      x.drawImage(src, (96-w)/2, (54-hh)/2, w, hh); return c.toDataURL('image/png');
    } catch(e){ return null; }
  },
  write(n, auto){
    const g = Game; if (!g.s) return false;
    const p = World.player; if (World.map && p) g.s.pos = {map:World.map.id, x:p.x, y:p.y, dir:p.dir};
    const meta = {slot:n, savedAt:Date.now(), day:g.s.day, min:Math.floor(g.s.min), cash:g.s.cash, name:g.s.name, map:World.map ? World.map.name : '', play:Math.floor(g.s.playSec), thumb:this.thumb(), v:1};
    const payload = {v:1, savedAt:meta.savedAt, meta, data:JSON.stringify(g.s)};
    const k = this.key(n), prev = LS.get(k); if (prev) LS.set(k + '.bak', prev);
    let ok = LS.set(k, JSON.stringify(payload));
    if (!ok){ meta.thumb = null; ok = LS.set(k, JSON.stringify(payload)); }
    Cloud.push(n, payload);
    if (ok || Cloud.on()){ UI.saved(); if (!auto) Snd.play('save'); }
    else UI.toast('Saving failed: this browser blocked storage.', '💾', 'warn');
    return ok;
  },
  del(n){ LS.del(this.key(n)); LS.del(this.key(n) + '.bak'); Cloud.push(n, {del:true}); },
  exportCode(n){ const p = this.read(n); if (!p) return ''; return 'PD1:' + b64e(JSON.stringify({v:1, meta:Object.assign({}, p.meta, {thumb:null}), data:p.data})); },
  importCode(n, code){
    code = (code || '').trim(); if (code.startsWith('PD1:')) code = code.slice(4);
    const o = JSON.parse(b64d(code)), data = JSON.parse(o.data);
    if (!data || !data.look || !data.inv || !data.pos) throw new Error('bad save');
    const meta = Object.assign({}, o.meta, {slot:n, savedAt:Date.now()}), payload = {v:1, savedAt:meta.savedAt, meta, data:o.data};
    LS.set(this.key(n), JSON.stringify(payload)); Cloud.push(n, payload); return true;
  },
};

const Cloud = {
  db:null, uid:null, slots:{}, writing:{}, pending:{},
  on(){ return !!this.db; },
  async init(){
    try {
      const C = window.claude; if (!C || typeof C.use !== 'function') return;
      const [db, user] = await Promise.all([C.use('db'), C.use('user')]); if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      for (const n of [1,2,3]){
        try { const snap = await this.ref(n).get(); this.slots[n] = snap.exists ? snap.data() : null; }
        catch(e){ const c = e && e.code; if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed'){ this.db = null; return; } }
      }
      this.reconcile();
      if (Game.mode === 'title' && $('#panel').hidden) UI.title();
    } catch(e){ this.db = null; }
  },
  ref(n){ return this.db.collection('data/users/' + this.uid).doc('slot' + n); },
  reconcile(){
    for (const n of [1,2,3]){
      const c = this.slots[n], l = Save.read(n), cs = (c && c.savedAt) || 0, ls = (l && l.savedAt) || 0;
      if (c && c.data && c.meta && cs > ls + 1000) LS.set(Save.key(n), JSON.stringify({v:1, savedAt:c.savedAt, meta:c.meta, data:c.data}));
      else if (l && ls > cs + 1000) this.push(n, l);
    }
  },
  push(n, payload){ if (!this.db) return; this.pending[n] = payload; if (!this.writing[n]) this.flush(n); },
  async flush(n){
    const p = this.pending[n]; if (!p || !this.db) return;
    this.pending[n] = null; this.writing[n] = true;
    try {
      if (p.del) await this.ref(n).delete();
      else await this.ref(n).set({v:1, savedAt:p.savedAt, meta:p.meta, data:p.data});
      this.slots[n] = p.del ? null : p;
    } catch(e){
      const c = e && e.code;
      if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed' || c === 'quota_exceeded' || c === 'transform_error') this.db = null;
    }
    this.writing[n] = false;
    if (this.pending[n]) this.flush(n);
  },
};

// ================= main =================
const Main = {
  ready:false, cv:null, ctx:null, vw:320, vh:180, scale:2, last:0, skip:false,
  init(){
    this.cv = $('#view'); this.ctx = this.cv.getContext('2d');
    Settings.load(); Input.init(); UI.init();
    addEventListener('resize', ()=>this.resize());
    if (window.visualViewport) visualViewport.addEventListener('resize', ()=>this.resize());
    this.ready = true; this.resize();
    Game.mode = 'boot'; UI.title();
    $('#game').addEventListener('pointerdown', ()=>{ if (Game.mode === 'boot') this.enter(); }, true);
    Cloud.init();
    requestAnimationFrame(t=>this.frame(t));
  },
  enter(){ if (Game.mode !== 'boot') return; Snd.unlock(); Game.mode = 'title'; UI.title(); Music.set('title'); },
  resize(){
    const g = $('#game'), w = g.clientWidth || innerWidth, hh = g.clientHeight || innerHeight;
    const div = Settings.d.zoom === 'near' ? 165 : Settings.d.zoom === 'far' ? 255 : 205;
    const sc = Math.max(1, Math.round(Math.min(w, hh)/div)), vw = Math.ceil(w/sc), vh = Math.ceil(hh/sc);
    this.scale = sc; this.vw = vw; this.vh = vh;
    this.cv.width = vw; this.cv.height = vh; this.cv.style.width = (vw*sc) + 'px'; this.cv.style.height = (vh*sc) + 'px';
    this.ctx.imageSmoothingEnabled = false; World.setView(vw, vh);
    if (World.map) World.snapCam();
  },
  frame(t){
    requestAnimationFrame(tt=>this.frame(tt));
    if (!Settings.d.fx){ this.skip = !this.skip; if (this.skip) return; }
    const dt = Math.min(.05, Math.max(0, (t - (this.last || t))/1000)); this.last = t;
    try {
      if (Game.mode === 'play' && World.map){ World.update(dt); if (World.map) World.draw(this.ctx); }
      else TitleScene.draw(this.ctx, this.vw, this.vh, dt);
    } catch(e){ console.error(e); }
  },
};
Main.init();
})();
